# Build 3 image production (api, web, cms) trên GitHub rồi đẩy lên GHCR.
# VPS chỉ việc `docker pull` (deploy/deploy.sh khi .env.production có IMAGE_REGISTRY) – không build trên VPS nữa.
#   ghcr.io/<owner>/yala-{api,web,cms}:<sha 7 ký tự>  +  :latest
# Biến NEXT_PUBLIC_* ("đóng băng" lúc build Next.js) lấy từ Settings → Secrets and variables → Actions → Variables.
name: Build images

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/**"
  workflow_dispatch:

# không huỷ lượt đang chạy: huỷ giữa bước deploy có thể cắt ngang migrate trên VPS -> xếp hàng chạy lần lượt
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # chặn image lỗi kiểu trước khi đẩy lên GHCR (typecheck tự chạy prisma generate qua turbo)
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tên image
        id: meta
        run: |
          TAG="$(git log -1 --format=%h --abbrev=7 -- . ':(exclude)*.md' ':(exclude)docs' ':(exclude)deploy')"
          echo "tag=${TAG:-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3 target chung 1 builder -> các tầng deps/source/next-build dùng lại giữa các bước
      - name: api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.repo }}/yala-api:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}/yala-api:latest
          cache-from: type=gha,scope=yala
          cache-to: type=gha,scope=yala,mode=max

      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://yala.vn' }}
            NEXT_PUBLIC_API_URL=http://api:4000
            API_URL=http://api:4000
            NEXT_PUBLIC_UPLOADS_BASE=${{ vars.NEXT_PUBLIC_UPLOADS_BASE }}
            NEXT_PUBLIC_GA4_ID=${{ vars.NEXT_PUBLIC_GA4_ID }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          tags: |
            ${{ steps.meta.outputs.repo }}/yala-web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}/yala-web:latest
          cache-from: type=gha,scope=yala
          cache-to: type=gha,scope=yala,mode=max

      - name: cms
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cms
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://yala.vn' }}
            NEXT_PUBLIC_API_URL=http://api:4000
            API_URL=http://api:4000
            NEXT_PUBLIC_UPLOADS_BASE=${{ vars.NEXT_PUBLIC_UPLOADS_BASE }}
            NEXT_PUBLIC_GA4_ID=${{ vars.NEXT_PUBLIC_GA4_ID }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          tags: |
            ${{ steps.meta.outputs.repo }}/yala-cms:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}/yala-cms:latest
          cache-from: type=gha,scope=yala
          cache-to: type=gha,scope=yala,mode=max

      - name: Tóm tắt
        run: |
          {
            echo "### Image đã đẩy lên GHCR – tag \`${{ steps.meta.outputs.tag }}\`"
            echo "Trên VPS: \`cd /opt/yala && git pull && bash deploy/deploy.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Tự deploy sau khi build xong. Chỉ chạy khi đã cài secret VPS_HOST + VPS_SSH_KEY (xem docs/ban-giao/tai-lieu/yala-deploy.md,
  # mục "Tự deploy từ GitHub Actions"). Khoá trên VPS bị khoá cứng bằng command=… -> chỉ chạy được deploy.sh, không mở shell.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy lên VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "Chưa cài VPS_HOST / VPS_SSH_KEY – bỏ qua tự deploy, chạy tay: cd /opt/yala && bash deploy/deploy.sh"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          if [ -n "$VPS_KNOWN_HOSTS" ]; then printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=30 "root@$VPS_HOST" deploy
          echo "### Đã deploy lên $VPS_HOST" >> "$GITHUB_STEP_SUMMARY"
