# ============================================================
# BƯỚC 1 (chưa có SSL): chỉ HTTP để Let's Encrypt xác minh tên miền.
# deploy/ssl-init.sh tự cài file này, xin chứng chỉ rồi thay bằng yala.vn.conf
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name yala.vn www.yala.vn admin.yala.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 503 "YALA dang cai dat SSL";
    }
}
