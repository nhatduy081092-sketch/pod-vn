# ============================================================
# YALA – Nginx production (/etc/nginx/sites-available/yala.vn.conf)
#   https://yala.vn        -> web  (127.0.0.1:3000)
#   https://admin.yala.vn  -> CMS  (127.0.0.1:3001)
#   www.yala.vn / http     -> 301 https://yala.vn
# API không public: web/cms gọi nội bộ (Docker network).
# ============================================================

# Có Upgrade -> "upgrade" (WebSocket); không có -> để trống để giữ keep-alive tới upstream
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Giới hạn tần suất ở tầng Nginx (bổ sung rate limit trong API)
limit_req_zone $binary_remote_addr zone=yala_api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=yala_login:10m rate=10r/m;

upstream yala_web { server 127.0.0.1:3000; keepalive 32; }
upstream yala_cms { server 127.0.0.1:3001; keepalive 8; }

# ---------- HTTP -> HTTPS (giữ đường ACME cho gia hạn) ----------
server {
    listen 80;
    listen [::]:80;
    server_name yala.vn www.yala.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://yala.vn$request_uri;
    }
}

# admin.yala.vn qua HTTP -> HTTPS admin
server {
    listen 80;
    listen [::]:80;
    server_name admin.yala.vn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }
    location / { return 301 https://admin.yala.vn$request_uri; }
}

# ---------- www -> apex ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yala.vn;
    include /etc/nginx/snippets/yala-ssl.conf;
    return 301 https://yala.vn$request_uri;
}

# ---------- Website ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yala.vn;

    include /etc/nginx/snippets/yala-ssl.conf;
    include /etc/nginx/snippets/yala-security.conf;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Ảnh thiết kế tối đa 15MB, file in 30MB (+ phần multipart)
    client_max_body_size 35m;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    access_log /var/log/nginx/yala.access.log;
    error_log  /var/log/nginx/yala.error.log warn;

    # Tài nguyên build của Next.js: tên file có hash -> cache 1 năm
    # (Next.js đã trả Cache-Control immutable cho các file này)
    location /_next/static/ {
        proxy_pass http://yala_web;
        include /etc/nginx/snippets/yala-proxy.conf;
    }

    # Ảnh upload (qua web -> API)
    location /uploads/ {
        proxy_pass http://yala_web;
        include /etc/nginx/snippets/yala-proxy.conf;
        expires 30d;
    }

    location /api/ {
        limit_req zone=yala_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://yala_web;
        include /etc/nginx/snippets/yala-proxy.conf;
    }

    # API quản trị chỉ dành cho CMS (gọi nội bộ trong Docker) -> không mở ra Internet
    location ^~ /api/admin/ { return 404; }

    location = /api/account/login {
        limit_req zone=yala_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://yala_web;
        include /etc/nginx/snippets/yala-proxy.conf;
    }

    # Endpoint nội bộ: CMS gọi thẳng http://web:3000/revalidate trong Docker, không mở ra Internet
    location = /revalidate {
        return 404;
    }

    location / {
        proxy_pass http://yala_web;
        include /etc/nginx/snippets/yala-proxy.conf;
    }
}

# ---------- CMS ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.yala.vn;

    include /etc/nginx/snippets/yala-ssl.conf;
    include /etc/nginx/snippets/yala-security.conf;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Tuỳ chọn: chỉ cho IP văn phòng vào CMS
    # allow 1.2.3.4;
    # deny all;

    client_max_body_size 20m;
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    access_log /var/log/nginx/yala-admin.access.log;
    error_log  /var/log/nginx/yala-admin.error.log warn;

    location = /login {
        limit_req zone=yala_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://yala_cms;
        include /etc/nginx/snippets/yala-proxy.conf;
    }

    location / {
        proxy_pass http://yala_cms;
        include /etc/nginx/snippets/yala-proxy.conf;
    }
}
