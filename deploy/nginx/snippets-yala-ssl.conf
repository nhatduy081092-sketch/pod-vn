# /etc/nginx/snippets/yala-ssl.conf – chứng chỉ Let's Encrypt + cấu hình TLS hiện đại
ssl_certificate     /etc/letsencrypt/live/yala.vn/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/yala.vn/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:YALA_SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
# Let's Encrypt đã ngừng OCSP (2025) -> không bật ssl_stapling
